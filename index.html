<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chisato • Profile</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#120a24;
    --night-2:#1b1036;
    --glass:rgba(255,255,255,.06);
    --glass-border:rgba(255,255,255,.14);
    --frost:#9fe8ff;
    --pink:#ff6fa8;
    --gold:#ffd76b;
    --mint:#6be8c9;
    --text:#f5f1ff;
    --muted:#b8adda;
    /* Canh vị trí khuôn mặt/đầu trong khung tròn avatar. "center 20%" nghĩa là
       neo 20% từ trên xuống — tăng % nếu đầu vẫn bị cắt, giảm nếu bị lệch xuống dưới. */
    --avatar-pos: center 20%;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    font-family:'Nunito', sans-serif;
    color:var(--text);
    background:#000;
    overflow-x:hidden;
  }

  /* ============================================================
     BOOT / TERMINAL SCREEN
  ============================================================ */
  #boot{
    position:fixed; inset:0;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    transition:opacity .6s ease;
    cursor:pointer;
  }
  #boot.hide{ opacity:0; pointer-events:none; }
  .term-window{
    width:min(92vw, 560px);
    background:#17151f;
    border-radius:12px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.8);
    overflow:hidden;
    border:1px solid rgba(255,255,255,.06);
  }
  .term-bar{
    display:flex;
    gap:7px;
    padding:10px 12px;
    background:#1f1c29;
  }
  .term-dot{ width:11px; height:11px; border-radius:50%; }
  .term-dot.r{ background:#ff5f57; }
  .term-dot.y{ background:#febc2e; }
  .term-dot.g{ background:#28c840; }
  .term-body{
    padding:26px 20px 30px;
    text-align:center;
  }
  #asciiArt{
    font-family:'JetBrains Mono', monospace;
    font-size:8.5px;
    line-height:8.5px;
    letter-spacing:0;
    white-space:pre;
    color:#e9e6f5;
    display:inline-block;
    margin:0 auto;
  }
  .boot-lines{
    margin-top:16px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--muted);
    min-height:96px;
  }
  .boot-line{
    opacity:0;
    transform:translateY(4px);
    transition:opacity .35s ease, transform .35s ease;
    margin:3px 0;
  }
  .boot-line.show{ opacity:1; transform:translateY(0); }
  .boot-line.prompt{
    color:var(--gold);
    font-weight:700;
    margin-top:10px;
    animation:blinkPrompt 1.1s step-end infinite;
  }
  @keyframes blinkPrompt{ 50%{ opacity:.35; } }

  /* ============================================================
     PROFILE PAGE
  ============================================================ */
  #profile{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
    position:relative;
    perspective:1200px;
  }
  .bg-video{
    position:fixed; inset:0; z-index:-2;
    width:100%; height:100%;
    object-fit:cover;
  }
  .bg-layer{
    position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(circle at 20% 25%, rgba(255,111,168,.28), transparent 45%),
      radial-gradient(circle at 80% 20%, rgba(159,232,255,.22), transparent 45%),
      radial-gradient(circle at 50% 85%, rgba(167,139,250,.26), transparent 50%),
      linear-gradient(160deg, rgba(18,10,36,.55), rgba(27,16,54,.6));
    background-size:200% 200%;
    animation:drift 18s ease-in-out infinite;
  }
  @keyframes drift{
    0%,100%{ background-position:0% 0%; }
    50%{ background-position:100% 100%; }
  }

  .card{
    width:min(92vw, 420px);
    background:rgba(255,255,255,.02);
    border:1px solid rgba(255,255,255,.22);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    border-radius:26px;
    padding:34px 26px 26px;
    text-align:center;
    box-shadow:
      0 30px 70px -24px rgba(0,0,0,.65),
      0 0 16px rgba(255,255,255,.55),
      0 0 34px rgba(255,255,255,.30),
      0 0 30px rgba(159,232,255,.30),
      0 0 56px rgba(255,111,168,.18),
      inset 0 0 0 1px rgba(255,255,255,.16);
    opacity:0;
    position:relative;
    transform-style:preserve-3d;
    will-change:transform;
    transform:translateY(18px) scale(.98);
    transition:opacity .7s ease, transform .7s ease, box-shadow 2.4s ease-in-out;
    animation:cardGlow 4.8s ease-in-out infinite;
  }
  @keyframes cardGlow{
    0%,100%{
      box-shadow:
        0 30px 70px -24px rgba(0,0,0,.65),
        0 0 14px rgba(255,255,255,.45),
        0 0 28px rgba(255,255,255,.22),
        0 0 26px rgba(159,232,255,.22),
        0 0 48px rgba(255,111,168,.14),
        inset 0 0 0 1px rgba(255,255,255,.12);
    }
    50%{
      box-shadow:
        0 30px 70px -24px rgba(0,0,0,.65),
        0 0 22px rgba(255,255,255,.75),
        0 0 46px rgba(255,255,255,.40),
        0 0 38px rgba(159,232,255,.36),
        0 0 66px rgba(255,111,168,.24),
        inset 0 0 0 1px rgba(255,255,255,.22);
    }
  }
  .card.in{ opacity:1; transform:translateY(0) scale(1); }
  /* Trong lúc đang nghiêng theo con trỏ, transform phải đổi NHANH (linear),
     nếu không nó sẽ bị kẹt vào transition .7s ở trên và trông như "đứng hình" / lệch. */
  .card.tilting{ transition:opacity .7s ease, transform .05s linear, box-shadow 2.4s ease-in-out; }

  .deco-ring{
    position:absolute;
    width:52px; height:52px;
    border-radius:50%;
    right:16px; bottom:16px;
    background:radial-gradient(circle at 32% 30%, rgba(255,255,255,.35), rgba(184,173,218,.12) 55%, transparent 72%);
    border:9px solid rgba(184,173,218,.30);
    pointer-events:none;
  }

  .deco-star{
    position:absolute;
    top:60%;
    right:-4px;
    font-size:22px;
    color:#fff;
    text-shadow:0 0 10px rgba(255,255,255,.6);
    animation:twinkle 2.4s ease-in-out infinite;
    pointer-events:none;
  }
  .deco-cat{
    position:absolute;
    width:60px; height:42px;
    pointer-events:auto;
    touch-action:none;
    cursor:grab;
    will-change:left, top;
    z-index:6;
    transform:translate(-50%,-50%);
    filter:drop-shadow(0 0 4px rgba(255,255,255,.5));
    /* Chặn menu bấm-giữ (Save Image/Chia sẻ/lookup...) và việc trình duyệt coi mèo
       là ảnh có thể kéo/copy — để giữ giữ nguyên trải nghiệm kéo-thả của riêng mình */
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    -webkit-user-drag:none;
    user-select:none;
    -khtml-user-drag:none;
    -moz-user-select:none;
    -ms-user-select:none;
  }
  .deco-cat.dragging{ cursor:grabbing; }
  .deco-cat .cat-visual{
    width:100%; height:100%;
    display:block;
    overflow:visible;
    transform:scaleX(var(--flip, 1));
    transition:transform .15s ease;
  }
  .deco-cat.walking .cat-visual{ transition:none; } /* lúc đi để JS tự điều khiển nghiêng người mượt hơn */
  .deco-cat .cat-visual *{ fill:#fff; stroke:#2a1f45; stroke-width:1.3; stroke-linejoin:round; }
  .deco-cat .cat-eye{ fill:#2a1f45; stroke:none; }
  .deco-cat .cat-nose{ fill:#2a1f45; stroke:none; }
  .deco-cat .cat-tail{
    fill:none; stroke:#fff; stroke-width:4; stroke-linecap:round; stroke-linejoin:round;
    animation:tailSwish 1.6s ease-in-out infinite;
  }

  /* Hai dáng KHÔNG BAO GIỜ hiện cùng lúc: đang đứng yên -> dáng ngồi nhìn thẳng (4 chân lộ đều);
     đang thật sự di chuyển -> dáng chạy nhìn nghiêng (chân do JS điều khiển, không dùng CSS animation
     vì animation-play-state kiểu cũ thỉnh thoảng bị trình duyệt "quên" chạy). */
  .deco-cat .pose-walk{ display:none; }
  .deco-cat.walking .pose-walk{ display:block; }
  .deco-cat.walking .pose-sit{ display:none; }

  .deco-cat.dragging .cat-tail{ animation:none; }
  .deco-cat .cat-eye{ transform-box:fill-box; transform-origin:center; animation:catBlink 3.2s steps(1) infinite; }
  @keyframes tailSwish{
    0%,100%{ transform:rotate(-8deg); }
    50%{ transform:rotate(10deg); }
  }
  @keyframes catBlink{
    0%, 92%, 100%{ transform:scaleY(1); }
    96%{ transform:scaleY(.1); }
  }
  .paw-trail{
    position:absolute;
    font-size:9px;
    opacity:.55;
    pointer-events:none;
    filter:grayscale(1) brightness(0) invert(1);
    animation:pawFade .7s ease-out forwards;
  }
  @keyframes pawFade{
    0%{ opacity:.55; transform:scale(1); }
    100%{ opacity:0; transform:scale(.6); }
  }

  .avatar-wrap{
    position:relative;
    width:112px; height:112px;
    margin:0 auto 16px;
    opacity:0;
    transform:scale(.35) rotate(-18deg);
    transition:opacity .65s cubic-bezier(.34,1.56,.64,1), transform .75s cubic-bezier(.34,1.56,.64,1);
    transition-delay:.12s;
  }
  .card.in .avatar-wrap{
    opacity:1;
    transform:scale(1) rotate(0deg);
    animation:avatarPulse 2.6s ease-in-out .9s infinite;
  }
  @keyframes avatarPulse{
    0%,100%{ filter:drop-shadow(0 0 0 rgba(255,255,255,0)); }
    50%{ filter:drop-shadow(0 0 10px rgba(255,255,255,.45)); }
  }
  .avatar-ring{
    position:absolute; inset:-6px;
    border-radius:50%;
    background:conic-gradient(from 0deg, #ffffff, var(--frost), #ffffff, var(--mint), #ffffff);
    animation:spin 6s linear infinite;
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
            mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .avatar{
    position:absolute; inset:0;
    border-radius:50%;
    background:#241a3d;
    display:flex; align-items:center; justify-content:center;
    font-size:52px;
    overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; object-position:var(--avatar-pos, center 20%); }
  .sparkle{
    position:absolute;
    font-size:12px;
    color:var(--frost);
    animation:twinkle 2.4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0; transform:scale(.4) rotate(0deg); }
    50%{ opacity:1; transform:scale(1) rotate(25deg); }
  }

  .title-line{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:21px;
    min-height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:2px;
    flex-wrap:wrap;
  }
  .title-cursor{
    display:inline-block;
    width:2px; height:20px;
    background:var(--frost);
    margin-left:2px;
    animation:blinkCursor .9s step-end infinite;
  }
  @keyframes blinkCursor{ 50%{ opacity:0; } }

  .badge-row{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:10px 0 20px;
  }
  .badge{
    width:30px; height:30px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
  }

  .discord-box{
    background:rgba(0,0,0,.28);
    border-radius:16px;
    padding:14px 16px;
    text-align:left;
    margin-bottom:18px;
  }
  .discord-user{
    display:flex; align-items:center; gap:10px;
    margin-bottom:10px;
  }
  .discord-avatar{
    width:34px; height:34px; border-radius:50%;
    background:linear-gradient(135deg, var(--pink), var(--frost));
    display:flex;align-items:center;justify-content:center;
    font-size:15px;
    flex-shrink:0;
    overflow:hidden;
  }
  .discord-avatar img{ width:100%; height:100%; object-fit:cover; object-position:var(--avatar-pos, center 20%); }
  .discord-name{ font-weight:800; font-size:14.5px; }
  .discord-bio{
    text-align:center;
    font-size:12.5px;
    font-style:italic;
    color:var(--muted);
    line-height:1.6;
  }

  .info-box{
    background:rgba(0,0,0,.22);
    border-radius:16px;
    padding:14px 10px;
    margin-bottom:20px;
    font-size:13.5px;
    font-weight:700;
    line-height:1.75;
    color:var(--text);
  }
  .info-box .muted-line{ color:var(--muted); font-weight:600; }

  .tech-row, .social-row{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
  }
  .tech-row{ margin-bottom:18px; }
  .tech-row img{ width:100%; max-width:340px; height:auto; display:block; }

  .social-icon{
    width:38px; height:38px;
    border-radius:50%;
    background:rgba(255,255,255,.9);
    display:flex; align-items:center; justify-content:center;
    padding:8px;
    text-decoration:none;
    transition:transform .15s ease;
  }
  .social-icon:active{ transform:scale(.9); }
  .social-icon img{ width:100%; height:100%; object-fit:contain; }

  .cursor-star{
    position:fixed;
    pointer-events:none;
    font-size:12px;
    color:var(--frost);
    z-index:40;
    animation:starFade .6s ease forwards;
  }
  @keyframes starFade{
    0%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(.2) rotate(45deg) translateY(-14px); }
  }
</style>
</head>
<body>

<!-- ============ BOOT SCREEN ============ -->
<div id="boot">
  <div class="term-window">
    <div class="term-bar">
      <div class="term-dot r"></div>
      <div class="term-dot y"></div>
      <div class="term-dot g"></div>
    </div>
    <div class="term-body">
      <pre id="asciiArt"></pre>
      <div class="boot-lines" id="bootLines"></div>
    </div>
  </div>
</div>

<!-- ============ PROFILE PAGE ============ -->
<video class="bg-video" autoplay muted loop playsinline>
  <source src="https://github.com/nhicode/ak/raw/refs/heads/main/YTSave_YouTube_Media_L-w6q7sIC2U_002_720p.mp4" type="video/mp4">
</video>
<div class="bg-layer"></div>
<div id="profile">
  <div class="card" id="card">
    <div class="avatar-wrap" id="avatarWrap">
      <div class="avatar-ring"></div>
      <div class="avatar" id="avatarEl"></div>
    </div>

    <div class="title-line"><span id="typedTitle"></span><span class="title-cursor"></span></div>

    <div class="badge-row">
      <div class="badge">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 6 2 12 8 18"></polyline><polyline points="16 6 22 12 16 18"></polyline></svg>
      </div>
      <div class="badge">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"></path></svg>
      </div>
      <div class="badge">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
      </div>
      <div class="badge">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5l8-3z"></path><polyline points="9 12 11.5 14.5 15.5 9.5"></polyline></svg>
      </div>

    <div class="discord-box">
      <div class="discord-user">
        <div class="discord-avatar" id="discordAvatarEl"></div>
        <div class="discord-name" id="discordNameEl"></div>
      </div>
      <div class="discord-bio" id="discordBioEl"></div>
    </div>

    <div class="deco-star">✦</div>
    <div class="deco-cat" id="decoCat">
      <svg class="cat-visual" viewBox="0 0 64 46" xmlns="http://www.w3.org/2000/svg">
        <!-- DÁNG NGỒI: nhìn thẳng vào màn hình, đầu to tròn kiểu chibi dễ thương, tai tam giác nhỏ
             gọn, 2 chân/paw tròn nhỏ lộ ra phía trước, đuôi cong vắt qua lưng -->
        <g class="pose-sit">
          <path class="cat-tail" d="M47,32 Q60,22 46,6" style="transform-origin:47px 32px"></path>
          <ellipse class="paw-shape" cx="24" cy="38" rx="5" ry="4"></ellipse>
          <ellipse class="paw-shape" cx="40" cy="38" rx="5" ry="4"></ellipse>
          <ellipse cx="32" cy="27" rx="17" ry="14"></ellipse>
          <circle cx="32" cy="13" r="11"></circle>
          <polygon points="22,8 26,-3 31,7"></polygon>
          <polygon points="33,7 38,-3 42,8"></polygon>
          <circle class="cat-eye" cx="27" cy="13" r="2.2"></circle>
          <circle class="cat-eye" cx="37" cy="13" r="2.2"></circle>
          <polygon class="cat-nose" points="30.5,17 33.5,17 32,19.3"></polygon>
        </g>

        <!-- DÁNG CHẠY: nhìn nghiêng theo hướng di chuyển, vẫn hình tròn/oval mềm mại, 4 chân bo
             tròn đầu do JS xoay theo nhịp bước, đuôi cong ra sau -->
        <g class="pose-walk">
          <path class="cat-tail" d="M12,28 Q0,20 5,6" style="transform-origin:12px 28px"></path>
          <g class="cat-leg leg-a" style="transform-origin:44px 34px"><rect x="42" y="34" width="4" height="9" rx="2"></rect></g>
          <g class="cat-leg leg-a" style="transform-origin:16px 34px"><rect x="14" y="34" width="4" height="9" rx="2"></rect></g>
          <g class="cat-leg leg-b" style="transform-origin:38px 34px"><rect x="36" y="34" width="4" height="9" rx="2"></rect></g>
          <g class="cat-leg leg-b" style="transform-origin:22px 34px"><rect x="20" y="34" width="4" height="9" rx="2"></rect></g>
          <ellipse cx="28" cy="26" rx="17" ry="11"></ellipse>
          <circle cx="46" cy="15" r="10"></circle>
          <polygon points="39,8 43,-2 48,7"></polygon>
          <circle class="cat-eye" cx="48" cy="14" r="1.9"></circle>
        </g>
      </svg>
    </div>
    <div class="deco-ring"></div>

    <div class="info-box" id="infoBoxEl"></div>

    <div class="tech-row" id="techRow"></div>
    <div class="social-row" id="socialRow"></div>
  </div>
</div>

<script>
/* ============================================================
   CẤU HÌNH — chỉnh mọi thông tin cá nhân ở đây
============================================================ */
const CONFIG = {
  avatarEmoji: "🐸",          // dùng để vẽ ASCII lúc boot + làm avatar mặc định
  avatarImageUrl: "https://raw.githubusercontent.com/nhicode/nhicode/main/0A9C3596-EAD0-46A5-9C28-CCA4D7CB61CC.jpeg",

  titles: [
    "Anime & Coding lover 💻",
    "Code. Sleep. Repeat.",
    "Chisato",
    "Anime & Coding ❤"
  ],

  discordUsername: "chisato2311",
  discordAvatarUrl: "https://raw.githubusercontent.com/nhicode/nhicode/main/0A9C3596-EAD0-46A5-9C28-CCA4D7CB61CC.jpeg",
  bioLines: [
    "Discord: chisato2311",
    "3 xác: Nhi • anhDUCK • MI"
  ],

  realName: "Nhi",
  birthYear: "2007",
  school: "Thành phố Hồ Chí Minh",
  country: "中华人民共和国",

  // Mã icon theo skillicons.dev — https://skillicons.dev để tra thêm/bớt mã khác
  techStack: [
    // Ngôn ngữ lập trình
    "c","cpp","cs","java","py","js","ts","php","ruby","go","rust",
    "swift","kotlin","dart","r","scala","perl","lua","haskell","clojure","solidity","matlab","bash","powershell",
    "html","css",
    // Framework / thư viện

/* ============================================================
   BOOT: ASCII từ emoji + hiệu ứng "giải mã"
============================================================ */
function buildAsciiFromEmoji(emoji, cols, rows){
  const cw = 12, ch = 24;
  const canvas = document.createElement('canvas');
  canvas.width = cols*cw; canvas.height = rows*ch;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `${canvas.height*0.82}px serif`;
  ctx.fillText(emoji, canvas.width/2, canvas.height/2 + canvas.height*0.03);
  const data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
  const ramp = " .:-=+*#%@";
  const lines = [];
  for(let r=0;r<rows;r++){
    let line = '';
    for(let c=0;c<cols;c++){
      let total=0, count=0;
      for(let yy=0; yy<ch; yy+=3){
        for(let xx=0; xx<cw; xx+=3){
          const x = c*cw+xx, y = r*ch+yy;
          const idx = (y*canvas.width + x)*4;
          total += (data[idx]+data[idx+1]+data[idx+2])/3;
          count++;
        }
      }
      const avg = total/count;
      const charIdx = Math.min(ramp.length-1, Math.floor((avg/255)*ramp.length));
      line += ramp[charIdx];
    }
    lines.push(line);
  }
  return lines;
}

function buildAsciiFromImage(imgUrl, cols, rows){
  return new Promise((resolve, reject)=>{
    const cw = 8, ch = 16;
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = cols*cw; canvas.height = rows*ch;
      const ctx = canvas.getContext('2d');
      // crop ảnh thành hình vuông ở giữa rồi vẽ full khung để nét hơn
      const side = Math.min(img.naturalWidth, img.naturalHeight);
      const sx = (img.naturalWidth - side)/2, sy = (img.naturalHeight - side)/2;
      ctx.drawImage(img, sx, sy, side, side, 0, 0, canvas.width, canvas.height);
      const data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
      const ramp = " .:-=+*#%@";
      const lines = [];
      for(let r=0;r<rows;r++){
        let line = '';
        for(let c=0;c<cols;c++){
          let total=0, count=0;
          for(let yy=0; yy<ch; yy+=2){
            for(let xx=0; xx<cw; xx+=2){
              const x = c*cw+xx, y = r*ch+yy;
              const idx = (y*canvas.width + x)*4;
              total += (data[idx]+data[idx+1]+data[idx+2])/3;
              count++;
            }
          }
          const avg = total/count;
          const charIdx = Math.min(ramp.length-1, Math.floor((avg/255)*ramp.length));
          line += ramp[charIdx];
        }
        lines.push(line);
      }
      resolve(lines);
    };
    img.onerror = reject;
    img.src = imgUrl;
  });
}

function animateAsciiReveal(targetLines, el, duration){
  return new Promise(resolve=>{
    const rows = targetLines.length;
    const cols = targetLines[0].length;
    const finishTimes = targetLines.map(()=>
      Array.from({length:cols}, ()=> Math.random()*duration*0.75)
    );
    const glitch = "!<>-_\\/[]{}=+*^?#";
    const start = performance.now();
    function frame(now){
      const t = now - start;
      let out = '';
      for(let r=0;r<rows;r++){
        let line = '';
        for(let c=0;c<cols;c++){
          const target = targetLines[r][c];
          if(target === ' '){ line += ' '; continue; }
          line += (t >= finishTimes[r][c]) ? target : glitch[(Math.random()*glitch.length)|0];
        }
        out += line + '\n';
      }
      el.textContent = out;
      if(t < duration){
        requestAnimationFrame(frame);
      } else {
        el.textContent = targetLines.join('\n');
        resolve();
      }
    }
    requestAnimationFrame(frame);
  });
}

function animateAsciiTypewriter(targetLines, el, totalDuration){
  return new Promise(resolve=>{
    const rows = targetLines.length;
    const cols = targetLines[0].length;
    const totalChars = rows*cols;
    const start = performance.now();
    function frame(now){
      const elapsed = now - start;
      // Bao nhiêu ký tự đáng lẽ đã hiện ra tính theo thời gian trôi qua,
      // thay vì đặt 1 setTimeout cho từng ký tự (rất nặng máy, gây giật lag cho toàn trang).
      const shown = Math.min(totalChars, Math.ceil((elapsed/totalDuration) * totalChars));
      let out = '';
      let count = 0;
      for(let r=0;r<rows;r++){
        let line = '';
        for(let c=0;c<cols;c++){
          line += (count < shown) ? targetLines[r][c] : ' ';
          count++;
        }
        out += line + '\n';
      }
      el.textContent = out;
      if(shown < totalChars){
        requestAnimationFrame(frame);
      } else {
        resolve();
      }
    }
    requestAnimationFrame(frame);
  });
}

function addBootLine(container, text, cls){

function detectSystem(){
  const ua = navigator.userAgent;
  if(/Windows/.test(ua)) return "Windows";
  if(/Mac OS X/.test(ua)) return /iPhone|iPad|iPod/.test(ua) ? "iOS" : "macOS";
  if(/Android/.test(ua)) return "Android";
  if(/Linux/.test(ua)) return "Linux";
  return "Unknown";
}

}

function renderTypedTitle(){
  const el = document.getElementById('typedTitle');
  const titles = CONFIG.titles;
  let ti = 0;

  function typeOut(text){
    return new Promise(resolve=>{
      let i = 0;
      const iv = setInterval(()=>{
        el.textContent = text.slice(0, i+1);
        i++;
        if(i >= text.length){ clearInterval(iv); resolve(); }
      }, 55);
    });
  }
  function eraseOut(text){
    return new Promise(resolve=>{
      let i = text.length;
      const iv = setInterval(()=>{
        el.textContent = text.slice(0, i-1);
        i--;
        if(i <= 0){ clearInterval(iv); resolve(); }
      }, 30);
    });
  }
  async function loop(){
    while(true){
      const text = titles[ti % titles.length];
      await typeOut(text);
      await new Promise(r=> setTimeout(r, 1400));
      await eraseOut(text);
      await new Promise(r=> setTimeout(r, 300));
      ti++;
    }
  }
  loop();
}

/* ============================================================
   MÈO TƯƠNG TÁC kiểu "desktop pet": mặc định NGỒI YÊN và nhìn
   theo hướng con trỏ, thỉnh thoảng tự đứng dậy đi lang thang,
   chạm/vuốt vào thẻ thì chạy tới đó, và vẫn kéo-thả tự do được.
   Luôn bị giữ bên trong viền thẻ.
============================================================ */
function initCat(catEl){
  const cardEl = catEl.closest('.card');
  const visualEl = catEl.querySelector('.cat-visual');
  const legsA = catEl.querySelectorAll('.leg-a');
  const legsB = catEl.querySelectorAll('.leg-b');
  const margin = 30;          // khoảng cách tối thiểu từ tâm mèo tới viền thẻ
  const wanderSpeed = 90;     // px/s khi tự đi lang thang
  const chaseSpeed = 160;     // px/s khi được "gọi" bằng chạm/vuốt
  const stopDist = 3;
  const stepCycle = 0.30;     // 1 chu kỳ bước chân (giây) — chỉnh số này để đi nhanh/chậm dáng chân
  const legSwingDeg = 28;     // biên độ xoay chân
  const bodyLeanDeg = 5;      // mèo hơi nghiêng người theo nhịp bước cho tự nhiên, giống vật lý đi thật

  let pos = null, target = null;
  let flip = 1;
  let mode = 'idle';          // 'idle' | 'walking' | 'dragging'
  let curSpeed = wanderSpeed;
  let lastNow = null;
  let lastPawTime = 0;
  let walkClock = 0;          // đồng hồ riêng cho dáng đi, chỉ chạy khi đang walking -> chân luôn động đậy khi đi
  let wanderTimer = null;
  let pointerId = null;
  let gestureActive = false;  // đang nhấn+vuốt trên thẻ (không phải nhấn lên chính con mèo)

  function bounds(){
    const w = cardEl.clientWidth, h = cardEl.clientHeight;
    return { minX:margin, maxX:Math.max(margin, w-margin), minY:margin, maxY:Math.max(margin, h-margin) };
  }
  function clamp(pt){
    const b = bounds();
    return { x: Math.min(Math.max(pt.x, b.minX), b.maxX), y: Math.min(Math.max(pt.y, b.minY), b.maxY) };
  }
  function render(){
    catEl.style.left = pos.x + 'px';
    catEl.style.top = pos.y + 'px';
    catEl.style.setProperty('--flip', flip);
  }
  function spawnPaw(now){
    if(now - lastPawTime < 240) return;
    lastPawTime = now;
    const paw = document.createElement('div');
    paw.className = 'paw-trail';
    paw.textContent = '🐾';
    paw.style.left = pos.x + 'px';
    paw.style.top = (pos.y + 14) + 'px';
    paw.style.transform = `translate(-50%,-50%) scaleX(${flip})`;
    cardEl.appendChild(paw);
    setTimeout(()=> paw.remove(), 700);
  }

  // Chân + dáng người do JS trực tiếp xoay mỗi khung hình — không phụ thuộc CSS animation
  // (animation-play-state kiểu cũ đôi lúc bị trình duyệt bỏ qua, gây ra hiện tượng "đi mà chân đứng im").
  function animateWalkPose(dt){
    walkClock += dt;
    const phase = (walkClock % stepCycle) / stepCycle;      // 0..1
    const swing = Math.sin(phase * Math.PI * 2);            // -1..1, mượt tự nhiên hơn kiểu giật cứng
    const legA = swing * legSwingDeg;
    const legB = -swing * legSwingDeg;
    legsA.forEach(el => el.style.transform = `rotate(${legA}deg)`);
    legsB.forEach(el => el.style.transform = `rotate(${legB}deg)`);
    // người hơi tréo/nghiêng theo nhịp bước, giống vật lý đi tự nhiên thay vì trượt cứng đơ
    const lean = swing * bodyLeanDeg;
    visualEl.style.transform = `scaleX(${flip}) rotate(${lean * flip}deg)`;
  }
  function resetWalkPose(){
    legsA.forEach(el => el.style.transform = '');
    legsB.forEach(el => el.style.transform = '');
    visualEl.style.transform = ''; // trả lại cho CSS (scaleX(var(--flip)) mượt khi đứng yên)
  }

  function scheduleWander(){
    clearTimeout(wanderTimer);
    const delay = 3500 + Math.random()*5000; // ngồi yên 3.5–8.5s rồi mới tự đứng dậy đi
    wanderTimer = setTimeout(()=>{
      if(mode !== 'idle') return;
      const b = bounds();
      target = clamp({ x: b.minX + Math.random()*(b.maxX-b.minX), y: b.minY + Math.random()*(b.maxY-b.minY) });
      curSpeed = wanderSpeed;
      mode = 'walking';
    }, delay);
  }

  // Vị trí khởi đầu: góc dưới-phải của thẻ, trong giới hạn cho phép
  requestAnimationFrame(()=>{
    const b = bounds();
    pos = clamp({ x: b.maxX, y: b.maxY - 26 });
    target = { ...pos };
    render();
    scheduleWander();
  });

  function goTo(clientX, clientY, speed){
    if(mode === 'dragging' || !pos) return;
    const rect = cardEl.getBoundingClientRect();
    target = clamp({ x: clientX - rect.left, y: clientY - rect.top });
    curSpeed = speed;
    mode = 'walking';
    clearTimeout(wanderTimer);
  }

  function frame(now){
    if(pos){
      if(lastNow === null) lastNow = now;
      const dt = Math.min(50, now - lastNow) / 1000;
      lastNow = now;

      if(mode === 'walking'){
        const dx = target.x - pos.x, dy = target.y - pos.y;
        const dist = Math.hypot(dx, dy);
        if(dist > stopDist){
          const step = Math.min(dist, curSpeed*dt);
          pos.x += (dx/dist) * step;
          pos.y += (dy/dist) * step;
          if(Math.abs(dx) > 1) flip = dx < 0 ? -1 : 1;
          pos = clamp(pos);
          catEl.classList.add('walking');
          animateWalkPose(dt);
          spawnPaw(now);
        } else {
          mode = 'idle';
          catEl.classList.remove('walking');
          resetWalkPose();
          scheduleWander();
        }
        render();
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Chạm hoặc vuốt lên THẺ (không phải lên chính con mèo) -> mèo chạy tới đó,
  // vuốt/kéo con trỏ đi đâu thì mèo rượt theo tới đó luôn (real-time).
  cardEl.addEventListener('pointerdown', (e)=>{
    if(e.target === catEl || catEl.contains(e.target)) return;
    gestureActive = true;
    goTo(e.clientX, e.clientY, chaseSpeed);
  });
  cardEl.addEventListener('pointermove', (e)=>{
    if(!gestureActive) return;
    goTo(e.clientX, e.clientY, chaseSpeed);
  });
  window.addEventListener('pointerup', ()=>{ gestureActive = false; });
  window.addEventListener('pointercancel', ()=>{ gestureActive = false; });

  // Lúc đang ngồi yên, mèo vẫn quay đầu "nhìn thẳng" theo hướng con trỏ trên trang
  document.addEventListener('pointermove', (e)=>{
    if(mode !== 'idle' || !pos) return;
    const rect = cardEl.getBoundingClientRect();
    const px = e.clientX - rect.left;
    if(Math.abs(px - pos.x) > 4){
      flip = px < pos.x ? -1 : 1;
      catEl.style.setProperty('--flip', flip);
    }
  });

  // Chặn menu bấm-giữ / bảng chọn của trình duyệt (Save Image, Chia sẻ, Lookup...) khi
  // người dùng nhấn giữ lên con mèo — để nhấn-giữ chỉ có nghĩa là "kéo-thả", không gì khác.
  catEl.addEventListener('contextmenu', (e)=> e.preventDefault());
  catEl.addEventListener('dragstart', (e)=> e.preventDefault());

  // Kéo - thả trực tiếp con mèo, luôn được ưu tiên cao nhất
  catEl.addEventListener('pointerdown', (e)=>{
    if(!pos) return;
    mode = 'dragging';
    pointerId = e.pointerId;
    catEl.classList.add('dragging');
    catEl.classList.remove('walking');
    resetWalkPose();
    catEl.setPointerCapture(pointerId);
    clearTimeout(wanderTimer);
    e.stopPropagation();
    e.preventDefault();
  });
  catEl.addEventListener('pointermove', (e)=>{
    if(mode !== 'dragging') return;
    const rect = cardEl.getBoundingClientRect();
    pos = clamp({ x: e.clientX - rect.left, y: e.clientY - rect.top });
    render();
  });
  function endDrag(){
    if(mode !== 'dragging') return;
    mode = 'idle';
    catEl.classList.remove('dragging');
    target = { ...pos }; // thả ra là ngồi yên tại chỗ, lát sau mới tự đi lang thang tiếp
    scheduleWander();
  }
  catEl.addEventListener('pointerup', endDrag);
  catEl.addEventListener('pointercancel', endDrag);
}

  document.body.appendChild(star);
  setTimeout(()=> star.remove(), 650);
});

/* ============================================================
   TƯƠNG TÁC 3D: thẻ nghiêng nhẹ theo vị trí con trỏ / chạm
============================================================ */
(function initTilt(){
  const profileEl = document.getElementById('profile');
  const cardEl = document.getElementById('card');
  const maxTilt = 18; // độ nghiêng tối đa — tăng số này nếu thấy còn YẾU, giảm nếu thấy còn MẠNH
  const ease = 0.10; // độ mượt: nhỏ hơn = mượt/chậm hơn

  let targetRotX = 0, targetRotY = 0, targetScale = 1;
  let curRotX = 0, curRotY = 0, curScale = 1;
  let looping = false;

  function loop(){
    curRotX += (targetRotX - curRotX) * ease;
    curRotY += (targetRotY - curRotY) * ease;
    curScale += (targetScale - curScale) * ease;
    cardEl.style.transform = `translateY(0) scale(${curScale}) rotateX(${curRotX.toFixed(2)}deg) rotateY(${curRotY.toFixed(2)}deg)`;
    const settled = Math.abs(targetRotX-curRotX) < 0.05 && Math.abs(targetRotY-curRotY) < 0.05 &&
                     Math.abs(targetScale-curScale) < 0.002 && targetRotX===0 && targetRotY===0 && targetScale===1;
    if(settled){
      looping = false;
      cardEl.style.transform = 'translateY(0) scale(1) rotateX(0deg) rotateY(0deg)';
      cardEl.classList.remove('tilting'); // về lại transition mượt .7s khi đã đứng yên
      return;
    }
    requestAnimationFrame(loop);
  }
  function ensureLoop(){
    cardEl.classList.add('tilting'); // bắt buộc phải bật class này, nếu không transform sẽ bị transition .7s "nuốt" mất và card trông như bị kẹt/nghiêng cứng
    if(!looping){ looping = true; requestAnimationFrame(loop); }
  }

  function setTarget(clientX, clientY){
    const rect = cardEl.getBoundingClientRect();
    const dx = (clientX - (rect.left + rect.width/2)) / (rect.width/2);
    const dy = (clientY - (rect.top + rect.height/2)) / (rect.height/2);
    targetRotY = Math.max(-1, Math.min(1, dx)) * maxTilt;
    targetRotX = Math.max(-1, Math.min(1, dy)) * -maxTilt;
    targetScale = 1.015; // độ phóng to khi rê chuột — tăng/giảm số này để chỉnh mạnh yếu
    ensureLoop();
  }
  function resetTarget(){
    targetRotX = 0; targetRotY = 0; targetScale = 1;
    ensureLoop();
  }

  profileEl.addEventListener('pointermove', (e)=>{
    if(!cardEl.classList.contains('in')) return;
    setTarget(e.clientX, e.clientY);
  });
  profileEl.addEventListener('pointerleave', resetTarget);
  profileEl.addEventListener('touchmove', (e)=>{
    if(!cardEl.classList.contains('in')) return;
    const touch = e.touches[0];
    if(touch) setTarget(touch.clientX, touch.clientY);
  }, { passive:true });
  profileEl.addEventListener('touchend', resetTarget);
})();

</script>
